name = "takuhon-cloudflare"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Bundled admin SPA (built from apps/admin with base "/admin/"). Build it before
# deploying: `pnpm --filter @takuhon/admin build`.
#
# `run_worker_first = true` makes the Worker mediate every request: the admin
# bundle's files sit at the assets root, so without this they would shadow the
# public "/" route. The Worker serves the bundle only for /admin/* (attaching
# the strict admin CSP) and handles everything else itself.
#
# SECURITY-CRITICAL: do not set this to false / remove it. The Worker is the
# only thing that attaches the strict admin CSP (plus HSTS / no-store) to the
# admin assets; serving them directly would expose the admin UI with no policy.
[assets]
directory = "../../apps/admin/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# Replace the placeholder ids after running:
#   wrangler kv namespace create TAKUHON_KV
#   wrangler kv namespace create TAKUHON_KV --preview
[[kv_namespaces]]
binding = "TAKUHON_KV"
id = "REPLACE_WITH_PRODUCTION_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_NAMESPACE_ID"

# Admin Origin allowlist (comma-separated). Empty value disables the check.
# Example for production: TAKUHON_ADMIN_ORIGIN = "https://admin.example.com"
#
# The admin bearer token MUST be provisioned as a Wrangler secret, never in
# this file:
#   wrangler secret put TAKUHON_ADMIN_TOKEN
# Use 32+ bytes of entropy, e.g. `openssl rand -base64 32`.
#
# Rate limiting for /api/admin/* is configured in the Cloudflare dashboard
# (Security → WAF → Rate limiting Rules), not here. Recommended profile:
# 10 requests/min keyed on the Authorization header. See adapter README.
[vars]
TAKUHON_ADMIN_ORIGIN = ""

# Image uploads (optional). Bind an R2 bucket to enable `POST /api/admin/assets`
# and `GET /assets/*` delivery; without it the upload endpoint stays
# unregistered (404) and avatars remain URL-only. Create the bucket, then
# uncomment:
#   wrangler r2 bucket create takuhon-assets
# [[r2_buckets]]
# binding = "TAKUHON_R2"
# bucket_name = "takuhon-assets"
