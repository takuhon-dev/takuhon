name: Bug report
description: Report a defect in meport (incorrect behavior, crash, regression)
title: '[bug]: '
labels: ['type:bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the sections below to help us reproduce and fix it.

        If this is a **security vulnerability**, do not file it here — use a private security advisory instead:
        https://github.com/takashi-matsuyama/meport/security/advisories/new

  - type: input
    id: package
    attributes:
      label: Affected package or area
      description: e.g. `@meport/core`, `@meport/api`, `@meport/ui`, `@meport/cli`, Cloudflare adapter, CI, docs
      placeholder: '@meport/core'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reliably reproduce the bug.
      placeholder: |
        1. Install meport vX.Y.Z
        2. Run `pnpm ...`
        3. Observe `...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior (logs / stack trace if any)
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Package version, git commit, or branch you are on
      placeholder: 'v0.1.0 or commit abc1234'
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Runtime / environment
      description: e.g. Node 24 on macOS 14, Cloudflare Workers, Vercel Edge, etc.
      placeholder: 'Node 24, macOS 14'
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Configuration snippets, screenshots, links to related issues, etc.
