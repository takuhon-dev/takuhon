name: Security scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Monday 03:00 UTC sweep so leaks introduced into already-merged
    # main are caught even when no PRs are flowing.
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (secrets in tree + history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action posts a PR comment summarising findings.
      pull-requests: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # `fetch-depth: 0` is mandatory: gitleaks must scan the full
          # commit history, not just the tip, to catch secrets that were
          # transiently committed and later reverted.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: 'true'
          # The repo-local `.gitleaks.toml` allowlists known-safe patterns
          # (e.g. the `Co-Authored-By: Claude ...` trailer that AGENTS.md
          # documents as a permitted git metadata exception).
          GITLEAKS_CONFIG: .gitleaks.toml

  planning-leak-guard:
    name: planning-repo + internal-doc reference guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Grep for planning-repo paths and internal-doc IDs
        run: |
          set -euo pipefail
          # Patterns that must NOT appear in the public takuhon impl tree:
          #   - `takuhon-planning/` or `basou-planning/` literal paths
          #     (these are permanently-private planning repos)
          #   - `Y-[0-9]+ Section ...` style internal doc identifiers
          #   - kozou-planning / basou (as planning repo, distinct from
          #     basou-dev OSS) only when used as a path or doc identifier
          # The symlink target referenced inside .git/ is excluded; we
          # only scan tracked files.
          if git grep -nE 'takuhon-planning/|basou-planning/|kozou-planning/|\bY-[0-9]+(\.[0-9]+)? Section ' -- . \
              ':!.git/**' ; then
            echo "::error::Planning-repo path or internal-doc identifier leaked into tracked files. See matches above."
            exit 1
          fi

  host-path-guard-tree:
    name: host path guard (repo tree)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Grep tracked files for absolute host paths
        run: |
          set -euo pipefail
          # Absolute host paths must never appear in tracked files. We
          # do NOT exclude `/home/runner/...` here: the CI runner home
          # path should never be checked into the repo (it can only come
          # from accidentally committing a CI artifact).
          #
          # `bin.mjs` and `init.ts` contain the literal substring
          # `host-machine absolute paths` in a docstring/comment — that
          # is descriptive English, not a path, so the regex anchors on
          # the `/` prefix.
          #
          # Excluded paths:
          #   - .git/** (vcs internals)
          #   - **/*.test.{ts,tsx} (RFC 7807 type URIs are fine, no host paths
          #     actually appear there)
          #   - docs/publishing.md (documents the pre-publish guard itself)
          #   - CHANGELOG.md (documents the pre-publish guard itself)
          #   - this workflow + publish.yml (define the very patterns we
          #     search for, so they would always self-match)
          if git grep -nE '(^|[^A-Za-z0-9])(/Users/|/home/[a-z][a-z0-9_-]*/)' -- . \
              ':!.git/**' \
              ':!**/*.test.{ts,tsx}' \
              ':!docs/publishing.md' \
              ':!CHANGELOG.md' \
              ':!.github/workflows/security-scan.yml' \
              ':!.github/workflows/publish.yml' ; then
            echo "::error::Absolute host path leaked into tracked files. See matches above."
            exit 1
          fi

  host-path-guard-dist:
    name: host path guard (built artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Grep dist/ for absolute host paths
        run: |
          set -euo pipefail
          # In built artifacts the runner home (/home/runner/...) is
          # particularly dangerous because it ends up in sourcemap
          # `sources` and `sourcesContent` fields. We grep for both
          # /Users/ and any /home/<user>/ including /home/runner/.
          #
          # Use `find` rather than a shell glob so missing dist dirs do
          # not error (some workspace packages emit no dist).
          dist_dirs="$(find packages adapters apps -maxdepth 2 -type d -name dist 2>/dev/null || true)"
          if [ -z "$dist_dirs" ]; then
            echo "No dist/ directories found — build skipped emitting artifacts. This is unexpected after \`pnpm build\`."
            exit 1
          fi
          suspicious="$(echo "$dist_dirs" | xargs -I {} grep -r -E '/Users/|/home/[a-z][a-z0-9_-]*/' {} 2>/dev/null || true)"
          if [ -n "$suspicious" ]; then
            echo "::error::Absolute host path leaked into built artifacts (sourcemap or otherwise)."
            printf '%s\n' "$suspicious"
            exit 1
          fi

  caronima-internal-terms:
    name: Caronima internal-terms guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Grep for internal slugs / doc identifiers
        run: |
          set -euo pipefail
          # Hardcoded list of known internal references that must not
          # appear in the public impl tree:
          #   - `Y-2 Section 1.3` / `Y-1.5 Section 5.1` style internal
          #     planning-doc citation suffixes
          #   - `caronima.internal` / `caronima.local` style internal
          #     domains
          # Extend this list as new internal identifiers are introduced
          # to the planning side.
          if git grep -nE '\bY-[0-9]+(\.[0-9]+)? Section [0-9]+(\.[0-9]+)?|caronima\.internal|caronima\.local' -- . \
              ':!.git/**' ; then
            echo "::error::Caronima-internal identifier leaked into tracked files. See matches above."
            exit 1
          fi
