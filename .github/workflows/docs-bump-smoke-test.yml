name: Docs bump smoke test

# Temporary, manually triggered smoke test for the release pipeline's
# update-docs-site job. It exercises the full cross-repo path — minting the
# takuhon-site App token, checking the repo out, setting up pnpm, running the
# real bump + generate, and opening a PR via create-pull-request — without an
# npm publish. It opens a throwaway "do not merge" PR on takuhon-site whose
# only change is a marker file. Delete this workflow once the path is verified.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: docs-bump smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint a GitHub App token scoped to takuhon-site
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SITE_BUMP_APP_ID }}
          private-key: ${{ secrets.SITE_BUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: takuhon-site
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout takuhon-site
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/takuhon-site
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: takuhon-site

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: takuhon-site/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: takuhon-site/.nvmrc

      - name: Run the real bump + generate, then force a diff
        working-directory: takuhon-site
        run: |
          set -euo pipefail
          # Mirror the real job's commands so the fixed pnpm setup is exercised
          # in the same subdirectory context. @takuhon/core is already at the
          # latest release, so this is a no-op; the marker below forces a diff
          # for create-pull-request to open.
          pnpm add -E "@takuhon/core@latest"
          pnpm gen:docs
          printf 'Smoke test for the automated docs bump PR.\nSafe to close; no docs change. Run: %s\n' "${GITHUB_RUN_ID}" > SMOKE_TEST_docs_bump.md

      - name: Open a throwaway test PR on takuhon-site
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: takuhon-site
          base: main
          branch: test/docs-bump-smoke
          delete-branch: true
          add-paths: |
            SMOKE_TEST_docs_bump.md
            package.json
            pnpm-lock.yaml
            src/content/docs/**
          commit-message: 'test: docs-bump smoke test (do not merge)'
          title: 'TEST: docs-bump smoke test — do not merge'
          body: |
            Verifies the release pipeline can mint the takuhon-site App token, check the repo out, set up pnpm, and open a PR via create-pull-request — the path that failed on the v0.7.0 run before the pnpm-setup fix.

            Safe to close. The only change is a throwaway marker file; `@takuhon/core` is already at the latest release, so there is no docs change.
