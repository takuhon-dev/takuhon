name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no actual publish)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @takuhon/* to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Pre-publish tarball sanity check
        # Inspect the tarball that would ship to npm for each publishable
        # package and fail if it contains any of:
        #   - stale brand identifiers from earlier renames (meport,
        #     ownport-dev, ownport)
        #   - host-machine absolute paths from the build environment
        #     (the runner home path /home/runner/ is the expected build
        #     location and is excluded; anything else is suspicious)
        # This guards against developer-side leakage when local dist/ is
        # not rebuilt from scratch; CI always starts from a fresh checkout
        # so the check should normally be a no-op. Uses `pnpm pack` rather
        # than `npm pack` so workspace: dependency specifiers resolve
        # correctly.
        run: |
          set -euo pipefail
          extract_root="$(mktemp -d)"
          trap 'rm -rf "$extract_root"' EXIT
          for pkg in packages/core packages/api packages/ui packages/cli; do
            echo "=== inspecting $pkg ==="
            extract_dir="$extract_root/${pkg##*/}"
            mkdir -p "$extract_dir"
            tarball="$(cd "$pkg" && pnpm pack --pack-destination "$extract_dir" | tail -n 1)"
            echo "Tarball: $tarball"
            tar -tzf "$tarball" | sed 's/^/  /'
            tar -xzf "$tarball" -C "$extract_dir"

            # Brand-identifier leak check (word-boundary anchored)
            if grep -r -E '\b(meport|ownport-dev|ownport)\b' "$extract_dir/package" 2>/dev/null; then
              echo "::error file=$pkg::Found stale brand identifiers in published tarball — rebuild dist/ from a clean state"
              exit 1
            fi

            # Host-path leak check (exclude expected GitHub-runner path)
            suspicious_paths="$(grep -r -E '/Users/|/home/' "$extract_dir/package" 2>/dev/null | grep -v '/home/runner/' || true)"
            if [ -n "$suspicious_paths" ]; then
              echo "::error file=$pkg::Found host-machine absolute paths in published tarball:"
              printf '%s\n' "$suspicious_paths"
              exit 1
            fi
          done

      # The publish steps below filter to `@takuhon/*` scoped packages only.
      # The bare-name `takuhon` redirect package (`packages/takuhon/`) is
      # published in a separate operator-driven step (Phase D of the OSS
      # publish plan) because:
      #   1. Its dependency on `@takuhon/cli` via `workspace:*` resolves to
      #      a registry version that must exist before the bare-name shim
      #      is installable.
      #   2. npm's similar-name policy may block the bare-name and require
      #      a manual dispute; we do not want that to abort the scoped
      #      publish flow.
      - name: Publish (dry-run, scoped packages only)
        if: ${{ inputs.dry_run == true }}
        run: pnpm --filter '@takuhon/*' publish --access=public --no-git-checks --dry-run

      - name: Publish (real, scoped packages only)
        if: ${{ inputs.dry_run != true }}
        run: pnpm --filter '@takuhon/*' publish --access=public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
