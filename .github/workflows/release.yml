name: Release

# Triggered by `vX.Y.Z` tag push for a real publish, or by manual
# workflow_dispatch (always dry-run only) for a packaging smoke test.
# Real publish is double-gated: the workflow_dispatch branch always takes
# the dry-run path even with dry_run=false (the `event_name == push`
# check below blocks it), so an accidental manual trigger cannot leak
# a publish.
#
# NOTE: the dry-run path runs `pnpm publish --dry-run` which exercises
# packing and pre-publish checks but does NOT exercise the OIDC auth
# handshake or provenance generation. The full OIDC trusted-publishing
# path is only validated by an actual `vX.Y.Z` tag push.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip the actual publish (packing dry-run only — does not exercise OIDC auth or provenance). Tag-push real publish always ignores this and runs.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================================
  # 1. verify
  #    The tag's tree passes the same gates as CI before any publish
  #    step runs. Catches a tag pushed at a green-but-then-broken commit.
  # ==========================================================
  verify:
    name: Verify (typecheck / lint / format / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

  # ==========================================================
  # 2. publish-scoped
  #    Each `@takuhon/*` scoped package is published in parallel via a
  #    matrix. Each job exchanges an OIDC token with the npm registry for
  #    SLSA provenance v1 attestation. No `NPM_TOKEN` secret is used.
  # ==========================================================
  publish-scoped:
    name: Publish ${{ matrix.pkg }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # OIDC token exchange with the npm registry for trusted publishing
      # requires `id-token: write` on the job.
      id-token: write

    # fail-fast: true because the workspace dep graph is not flat
    # (core ← api ← cloudflare, core ← ui, core ← activity ← cli ←
    # takuhon-bare). If, say, core fails to publish but api succeeds, the
    # api@<v> tarball on the registry would carry a dependency on core@<v>
    # that does not exist there — a dangling install state. Stopping on the
    # first failure lets the operator delete the tag, fix the cause, and
    # re-tag without ever exposing a partial release set to consumers.
    strategy:
      fail-fast: true
      matrix:
        include:
          - pkg: '@takuhon/core'
            dir: packages/core
          - pkg: '@takuhon/api'
            dir: packages/api
          - pkg: '@takuhon/ui'
            dir: packages/ui
          - pkg: '@takuhon/activity'
            dir: packages/activity
          - pkg: '@takuhon/mcp'
            dir: packages/mcp
          - pkg: '@takuhon/cli'
            dir: packages/cli
          - pkg: '@takuhon/cloudflare'
            dir: adapters/cloudflare
          - pkg: '@takuhon/vercel'
            dir: adapters/vercel

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      # NOTE: We deliberately omit `registry-url`. Setting it would make
      # setup-node write `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # to a temp .npmrc. `NODE_AUTH_TOKEN` is unset (we publish via OIDC),
      # but npm CLI would still ship the empty token as a Bearer credential,
      # the registry would reject it, and the OIDC trusted publisher
      # exchange would never happen. We overwrite ~/.npmrc in a follow-up
      # step with only the registry line.
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Configure npm registry without a token line (so OIDC takes over)
        run: |
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc
          cat ~/.npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspace packages
        run: pnpm build

      - name: Pre-publish tarball sanity check (${{ matrix.pkg }})
        # Inspect the tarball that would ship to npm for this matrix
        # package and fail if it contains:
        #   - stale brand identifiers from earlier renames
        #     (meport, ownport-dev, ownport)
        #   - host-machine absolute paths from the build environment
        #     (the runner home path /home/runner/ is the expected build
        #     location and is excluded; anything else is suspicious)
        run: |
          set -euo pipefail
          extract_root="$(mktemp -d)"
          trap 'rm -rf "$extract_root"' EXIT
          extract_dir="$extract_root/inspect"
          mkdir -p "$extract_dir"
          tarball="$(cd "${{ matrix.dir }}" && pnpm pack --pack-destination "$extract_dir" | tail -n 1)"
          echo "Tarball: $tarball"
          tar -tzf "$tarball" | sed 's/^/  /'
          tar -xzf "$tarball" -C "$extract_dir"

          if grep -r -E '\b(meport|ownport-dev|ownport)\b' "$extract_dir/package" 2>/dev/null; then
            echo "::error file=${{ matrix.dir }}::Found stale brand identifiers in published tarball — rebuild dist/ from a clean state"
            exit 1
          fi

          suspicious_paths="$(grep -r -E '/Users/|/home/' "$extract_dir/package" 2>/dev/null | grep -v '/home/runner/' || true)"
          if [ -n "$suspicious_paths" ]; then
            echo "::error file=${{ matrix.dir }}::Found host-machine absolute paths in published tarball:"
            printf '%s\n' "$suspicious_paths"
            exit 1
          fi

      - name: Pack and publish ${{ matrix.pkg }} (OIDC trusted publishing)
        working-directory: ${{ matrix.dir }}
        # Real publish only on a tag push. workflow_dispatch always takes
        # the dry-run branch even with dry_run=false (TRAP 6: double-gate).
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${{ inputs.dry_run || 'false' }}" != "true" ]; then
            # Idempotency guard: a re-tagged release (the documented recovery
            # after a fail-fast stop) or an operator bootstrap publish of a
            # brand-new package may have put this exact version on the
            # registry already. Skipping instead of failing keeps the
            # fail-fast matrix from cancelling the remaining packages over a
            # version that is, in fact, released.
            VERSION="$(node -p "require('./package.json').version")"
            if [ "$(npm view "${{ matrix.pkg }}@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "${{ matrix.pkg }}@$VERSION is already on the registry — skipping publish (idempotent re-run)"
              exit 0
            fi
            echo "Real publish: pnpm pack + npm publish (OIDC + provenance)"
            pnpm pack
            TGZ="$(ls *.tgz | head -1)"
            echo "Publishing tarball: $TGZ"
            # pnpm pack rewrites workspace:* deps to their actual semver
            # version. npm CLI v11.5+ handles the OIDC 2-audience exchange
            # (sigstore + npm) and emits SLSA provenance v1 attestation.
            npm publish "$TGZ" --access public --provenance
          else
            echo "Dry-run (event=$GITHUB_EVENT_NAME, dry_run=${{ inputs.dry_run || 'false' }}): pnpm publish --dry-run"
            pnpm publish --access public --provenance --no-git-checks --dry-run
          fi

  # ==========================================================
  # 3. publish-bare
  #    The bare-name `takuhon` redirect package depends on `@takuhon/cli`
  #    via workspace:*. pnpm pack rewrites that to the published semver,
  #    so the tarball itself is valid the moment we cut it; but we still
  #    publish it *after* the scoped packages so that a consumer running
  #    `npm i -g takuhon` always finds `@takuhon/cli@<same-version>`
  #    already on the registry.
  #
  #    Splitting it out also isolates the bare-name from any npm
  #    similar-name policy disputes — the scoped publish flow finishes
  #    cleanly even if the bare-name job stalls.
  # ==========================================================
  publish-bare:
    name: Publish takuhon (bare-name)
    needs: publish-scoped
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Configure npm registry without a token line (so OIDC takes over)
        run: |
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc
          cat ~/.npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspace packages
        run: pnpm build

      - name: Pre-publish tarball sanity check (takuhon)
        run: |
          set -euo pipefail
          extract_root="$(mktemp -d)"
          trap 'rm -rf "$extract_root"' EXIT
          extract_dir="$extract_root/inspect"
          mkdir -p "$extract_dir"
          tarball="$(cd packages/takuhon && pnpm pack --pack-destination "$extract_dir" | tail -n 1)"
          echo "Tarball: $tarball"
          tar -tzf "$tarball" | sed 's/^/  /'
          tar -xzf "$tarball" -C "$extract_dir"

          if grep -r -E '\b(meport|ownport-dev|ownport)\b' "$extract_dir/package" 2>/dev/null; then
            echo "::error file=packages/takuhon::Found stale brand identifiers in published tarball — rebuild dist/ from a clean state"
            exit 1
          fi

          suspicious_paths="$(grep -r -E '/Users/|/home/' "$extract_dir/package" 2>/dev/null | grep -v '/home/runner/' || true)"
          if [ -n "$suspicious_paths" ]; then
            echo "::error file=packages/takuhon::Found host-machine absolute paths in published tarball:"
            printf '%s\n' "$suspicious_paths"
            exit 1
          fi

      - name: Pack and publish takuhon (OIDC trusted publishing)
        working-directory: packages/takuhon
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${{ inputs.dry_run || 'false' }}" != "true" ]; then
            # Idempotency guard — see publish-scoped for the rationale.
            VERSION="$(node -p "require('./package.json').version")"
            if [ "$(npm view "takuhon@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "takuhon@$VERSION is already on the registry — skipping publish (idempotent re-run)"
              exit 0
            fi
            echo "Real publish: pnpm pack + npm publish (OIDC + provenance)"
            pnpm pack
            TGZ="$(ls *.tgz | head -1)"
            echo "Publishing tarball: $TGZ"
            npm publish "$TGZ" --access public --provenance
          else
            echo "Dry-run (event=$GITHUB_EVENT_NAME, dry_run=${{ inputs.dry_run || 'false' }}): pnpm publish --dry-run"
            pnpm publish --access public --provenance --no-git-checks --dry-run
          fi

  # ==========================================================
  # 3b. publish-create-takuhon
  #    The `create-takuhon` initializer is an unscoped redirect package
  #    (like the bare-name `takuhon`) that depends on `@takuhon/cli` via
  #    workspace:*. pnpm pack rewrites that to the published semver, and it
  #    publishes after the scoped packages so `npm create takuhon` always
  #    finds `@takuhon/cli@<same-version>` already on the registry.
  #
  #    It is intentionally NOT a dependency of github-release / update-docs-site:
  #    isolating it means a stall here (e.g. its first publish before the npm
  #    trusted publisher is configured) never blocks the scoped release, the
  #    GitHub Release, or the docs bump. Re-run just this job once resolved.
  # ==========================================================
  publish-create-takuhon:
    name: Publish create-takuhon (initializer)
    needs: publish-scoped
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Configure npm registry without a token line (so OIDC takes over)
        run: |
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc
          cat ~/.npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspace packages
        run: pnpm build

      - name: Pre-publish tarball sanity check (create-takuhon)
        run: |
          set -euo pipefail
          extract_root="$(mktemp -d)"
          trap 'rm -rf "$extract_root"' EXIT
          extract_dir="$extract_root/inspect"
          mkdir -p "$extract_dir"
          tarball="$(cd packages/create-takuhon && pnpm pack --pack-destination "$extract_dir" | tail -n 1)"
          echo "Tarball: $tarball"
          tar -tzf "$tarball" | sed 's/^/  /'
          tar -xzf "$tarball" -C "$extract_dir"

          if grep -r -E '\b(meport|ownport-dev|ownport)\b' "$extract_dir/package" 2>/dev/null; then
            echo "::error file=packages/create-takuhon::Found stale brand identifiers in published tarball — rebuild dist/ from a clean state"
            exit 1
          fi

          suspicious_paths="$(grep -r -E '/Users/|/home/' "$extract_dir/package" 2>/dev/null | grep -v '/home/runner/' || true)"
          if [ -n "$suspicious_paths" ]; then
            echo "::error file=packages/create-takuhon::Found host-machine absolute paths in published tarball:"
            printf '%s\n' "$suspicious_paths"
            exit 1
          fi

      - name: Pack and publish create-takuhon (OIDC trusted publishing)
        working-directory: packages/create-takuhon
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${{ inputs.dry_run || 'false' }}" != "true" ]; then
            # Idempotency guard — see publish-scoped for the rationale.
            VERSION="$(node -p "require('./package.json').version")"
            if [ "$(npm view "create-takuhon@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "create-takuhon@$VERSION is already on the registry — skipping publish (idempotent re-run)"
              exit 0
            fi
            echo "Real publish: pnpm pack + npm publish (OIDC + provenance)"
            pnpm pack
            TGZ="$(ls *.tgz | head -1)"
            echo "Publishing tarball: $TGZ"
            npm publish "$TGZ" --access public --provenance
          else
            echo "Dry-run (event=$GITHUB_EVENT_NAME, dry_run=${{ inputs.dry_run || 'false' }}): pnpm publish --dry-run"
            pnpm publish --access public --provenance --no-git-checks --dry-run
          fi

  # ==========================================================
  # 4. github-release
  #    After the scoped + bare npm packages publish successfully, create a
  #    GitHub Release with auto-generated release notes plus the ten
  #    tarballs as assets. Each tarball is signed with cosign keyless
  #    sign-blob (Sigstore Fulcio + Rekor) so downstream consumers can verify
  #    the bundle against the originating workflow run.
  #
  #    Skipped on workflow_dispatch (= dry-run only). The double-gate
  #    here matches the publish jobs above: `event_name == push` AND
  #    dry-run is not true. A non-tag push cannot reach this job because
  #    the workflow trigger filter already restricts to `v*.*.*` tags.
  # ==========================================================
  github-release:
    name: Create GitHub Release with signed tarball bundles
    needs: [publish-scoped, publish-bare]
    if: ${{ github.event_name == 'push' && (inputs.dry_run || 'false') != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Required to create a GitHub Release on the repository.
      contents: write
      # cosign keyless signing exchanges an OIDC token with Sigstore Fulcio
      # for the short-lived signing certificate.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspace packages
        run: pnpm build

      - name: Pack all ten publishable packages to artifacts/
        # pnpm pack rewrites workspace:* deps to their actual semver, so the
        # tarballs produced here match the ones published to npm by the
        # publish-scoped / publish-bare / publish-create-takuhon jobs above.
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          for d in packages/core packages/api packages/ui packages/activity packages/mcp packages/cli adapters/cloudflare adapters/vercel packages/takuhon packages/create-takuhon; do
            echo "Packing $d"
            (cd "$d" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/artifacts")
          done
          ls -la "$GITHUB_WORKSPACE/artifacts/"

      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign each tarball with cosign sign-blob (Sigstore keyless)
        # Sigstore keyless signing exchanges this job's OIDC token for a
        # short-lived signing certificate from Fulcio. The signature and
        # certificate land in a single `<tgz>.bundle` file that downstream
        # consumers can verify with `cosign verify-blob`.
        run: |
          set -euo pipefail
          for tgz in "$GITHUB_WORKSPACE"/artifacts/*.tgz; do
            echo "Signing $tgz"
            cosign sign-blob --yes --bundle "$tgz.bundle" "$tgz"
          done
          ls -la "$GITHUB_WORKSPACE/artifacts/"

      - name: Create GitHub Release with signed tarballs
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tgz
            artifacts/*.bundle

  # ==========================================================
  # 5. update-docs-site
  #    After the scoped + bare npm packages publish, open a pull request on
  #    the private takuhon-site repo that bumps its pinned `@takuhon/core`
  #    dependency to this release and regenerates the product-coupled docs
  #    (the install-page version and the takuhon.json schema reference)
  #    from the freshly published package. takuhon-site's own review/merge
  #    gate and Cloudflare deploy take it from there.
  #
  #    Cross-repo writes use a short-lived GitHub App token scoped to
  #    takuhon-site only (Contents + Pull requests). The job is a clean
  #    no-op unless those App credentials are present, so this pipeline is
  #    safe to run before the App is provisioned. Like the publish/release
  #    jobs it runs only on a real tag-push publish, never on a
  #    workflow_dispatch dry-run.
  # ==========================================================
  update-docs-site:
    name: Open takuhon-site docs bump PR
    needs: [publish-scoped, publish-bare]
    if: ${{ github.event_name == 'push' && (inputs.dry_run || 'false') != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The npm publish and GitHub Release already succeeded by the time this
    # runs; a failure to open the docs bump PR is recoverable and must not
    # mark the release run as failed.
    continue-on-error: true
    permissions:
      # This job writes nothing to this repo; the cross-repo pull request
      # is opened with the GitHub App token minted below.
      contents: read

    steps:
      - name: Check for the docs-site bump App credentials
        id: guard
        env:
          APP_ID: ${{ secrets.SITE_BUMP_APP_ID }}
          PRIVATE_KEY: ${{ secrets.SITE_BUMP_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SITE_BUMP_APP_ID / SITE_BUMP_APP_PRIVATE_KEY are not both set; skipping the takuhon-site docs bump. Provision the GitHub App to enable it."
          fi

      - name: Mint a GitHub App token scoped to takuhon-site
        id: app-token
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SITE_BUMP_APP_ID }}
          private-key: ${{ secrets.SITE_BUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: takuhon-site
          # Narrow the minted token to exactly what opening the PR needs, so
          # it fails closed even if the App is ever granted more.
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout takuhon-site
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/takuhon-site
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          # peter-evans/create-pull-request handles commit + push with the
          # token it is given, so the checkout itself must not leave the
          # App token persisted in the local git config.
          persist-credentials: false
          path: takuhon-site

      - name: Setup pnpm
        if: steps.guard.outputs.enabled == 'true'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          # takuhon-site is checked out into a subdirectory, so point the
          # action at its package.json to read the pinned pnpm version
          # (there is no package.json at the workspace root in this job).
          package_json_file: takuhon-site/package.json

      - name: Setup Node.js
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: takuhon-site/.nvmrc

      - name: Bump @takuhon/core and regenerate docs
        id: bump
        if: steps.guard.outputs.enabled == 'true'
        working-directory: takuhon-site
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          if [ ! -f scripts/gen-docs.mjs ]; then
            echo "::notice::takuhon-site has no scripts/gen-docs.mjs on main yet; skipping until the docs generator is merged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pin exactly to the version just published by the jobs above. npm
          # may need a moment to propagate the new version, so retry briefly.
          for attempt in 1 2 3 4 5; do
            if pnpm add -E "@takuhon/core@${version}"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::@takuhon/core@${version} is not installable after retries."
              exit 1
            fi
            echo "Attempt ${attempt} failed; waiting for npm to propagate @takuhon/core@${version}..."
            sleep 15
          done
          pnpm gen:docs
          # Decide on a bump using only the paths the PR will actually stage.
          if git diff --quiet -- package.json pnpm-lock.yaml src/content/docs; then
            echo "::notice::takuhon-site is already at @takuhon/core@${version}; nothing to bump."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi
          # Surface anything generated outside the committed allowlist so it is
          # not silently dropped from the PR.
          if ! git diff --quiet -- . ':!package.json' ':!pnpm-lock.yaml' ':!src/content/docs'; then
            echo "::warning::Changes outside the docs allowlist were produced; they will not be included in the PR."
          fi

      - name: Open the bump pull request
        if: steps.guard.outputs.enabled == 'true' && steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: takuhon-site
          base: main
          branch: bump/takuhon-core-${{ steps.bump.outputs.version }}
          delete-branch: true
          add-paths: |
            package.json
            pnpm-lock.yaml
            src/content/docs/**
          commit-message: 'chore(deps): bump @takuhon/core to ${{ steps.bump.outputs.version }} and regenerate docs'
          title: 'chore(deps): bump @takuhon/core to ${{ steps.bump.outputs.version }} and regenerate docs'
          body: |
            Automated by the takuhon release pipeline after publishing `${{ github.ref_name }}`.

            - Bumps the pinned `@takuhon/core` dependency to `${{ steps.bump.outputs.version }}`.
            - Regenerates the product-coupled docs regions with `pnpm gen:docs`.

            Review the regenerated docs in the diff, then merge to deploy.
